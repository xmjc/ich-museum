<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文化地理 · 安徽数字非遗博物馆</title>
<meta name="description" content="从淮河到新安江：安徽非遗的三条水系与三种性格，以及 16 市的分布示意。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23A83A28'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23F7F3EA' font-family='serif'%3E皖%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="map">
<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="sec-kicker reveal">Cultural Geography</p>
      <h1 class="sec-title reveal">三条水系<small>Three Rivers, Three Temperaments</small></h1>
      <p class="lead reveal" style="margin-top:20px">
        淮河、长江、新安江，把安徽切成三块气质不同的地方。
        非遗的分布几乎就是这三条水系的注脚——越往南，手艺越精细；越往北，声音越响亮。
      </p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <figure class="river-figure reveal" style="margin:0">
        <svg viewBox="0 0 1200 560" role="img" aria-label="安徽三大文化区与主要城市分布示意图">
          <defs>
            <linearGradient id="zone-s" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8C3B34" stop-opacity=".05"/>
              <stop offset="100%" stop-color="#8C3B34" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="zone-m" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2b4a5a" stop-opacity=".05"/>
              <stop offset="100%" stop-color="#2b4a5a" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="zone-n" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#B07C3C" stop-opacity=".06"/>
              <stop offset="100%" stop-color="#B07C3C" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <rect x="0" y="0" width="1200" height="215" fill="url(#zone-n)"/>
          <rect x="0" y="215" width="1200" height="175" fill="url(#zone-m)"/>
          <rect x="0" y="390" width="1200" height="170" fill="url(#zone-s)"/>

          <!-- 淮河 -->
          <path d="M40,206 C160,192 240,218 330,208 C430,197 500,218 600,208 C690,199 760,214 830,208"
                fill="none" stroke="#2b4a5a" stroke-opacity=".38" stroke-width="1.6"/>
          <text x="846" y="212" font-size="11" fill="#6b6659" letter-spacing="3">淮河</text>

          <!-- 长江 -->
          <path d="M70,372 C180,356 280,384 400,366 C520,348 610,372 710,362 C790,354 860,366 930,356"
                fill="none" stroke="#2b4a5a" stroke-opacity=".38" stroke-width="1.6"/>
          <text x="946" y="360" font-size="11" fill="#6b6659" letter-spacing="3">长江</text>

          <!-- 新安江 -->
          <path d="M400,470 C500,488 590,500 690,516" fill="none" stroke="#2b4a5a" stroke-opacity=".26"
                stroke-width="1.2" stroke-dasharray="4 5"/>
          <text x="704" y="522" font-size="11" fill="#8a8375" letter-spacing="3">新安江</text>

          <!-- 分区名 -->
          <text x="1178" y="72" text-anchor="end" font-size="30" fill="#B07C3C" fill-opacity=".5" font-family="'Noto Serif SC',serif" letter-spacing="6">皖北</text>
          <text x="1178" y="258" text-anchor="end" font-size="30" fill="#2b4a5a" fill-opacity=".5" font-family="'Noto Serif SC',serif" letter-spacing="6">皖中</text>
          <text x="1178" y="434" text-anchor="end" font-size="30" fill="#8C3B34" fill-opacity=".5" font-family="'Noto Serif SC',serif" letter-spacing="6">皖南</text>

          <!-- 城市 -->
          <g font-size="12" fill="#3c3a32" letter-spacing="1">
            <g fill="#B07C3C">
              <circle cx="250" cy="92" r="3.6"/><text x="262" y="97" fill="#3c3a32">亳州</text>
              <circle cx="404" cy="66" r="3.6"/><text x="416" y="71" fill="#3c3a32">淮北</text>
              <circle cx="474" cy="104" r="3.6"/><text x="486" y="109" fill="#3c3a32">宿州</text>
              <circle cx="168" cy="162" r="3.6"/><text x="180" y="167" fill="#3c3a32">阜阳</text>
              <circle cx="432" cy="172" r="3.6"/><text x="444" y="177" fill="#3c3a32">蚌埠</text>
              <circle cx="332" cy="186" r="3.6"/><text x="344" y="182" fill="#3c3a32">淮南</text>
            </g>
            <g fill="#2b4a5a">
              <circle cx="214" cy="286" r="3.6"/><text x="226" y="291" fill="#3c3a32">六安</text>
              <circle cx="352" cy="268" r="3.6"/><text x="364" y="273" fill="#3c3a32">合肥</text>
              <circle cx="500" cy="248" r="3.6"/><text x="512" y="253" fill="#3c3a32">滁州</text>
              <circle cx="562" cy="300" r="3.6"/><text x="574" y="305" fill="#3c3a32">马鞍山</text>
              <circle cx="470" cy="340" r="3.6"/><text x="482" y="345" fill="#3c3a32">芜湖</text>
              <circle cx="428" cy="392" r="3.6"/><text x="440" y="397" fill="#3c3a32">铜陵</text>
            </g>
            <g fill="#8C3B34">
              <circle cx="300" cy="368" r="3.6"/><text x="312" y="364" fill="#3c3a32">安庆</text>
              <circle cx="388" cy="420" r="3.6"/><text x="400" y="425" fill="#3c3a32">池州</text>
              <circle cx="540" cy="388" r="3.6"/><text x="552" y="393" fill="#3c3a32">宣城</text>
              <circle cx="408" cy="472" r="3.6"/><text x="420" y="477" fill="#3c3a32">黄山</text>
            </g>
          </g>

          <line x1="0" y1="215" x2="1200" y2="215" stroke="#d9d2c0" stroke-width="1" stroke-dasharray="2 6"/>
          <line x1="0" y1="390" x2="1200" y2="390" stroke="#d9d2c0" stroke-width="1" stroke-dasharray="2 6"/>
        </svg>
        <figcaption class="card-meta" style="margin-top:18px">示意图 · 城市位置为示意排布，不表示精确地理边界</figcaption>
      </figure>
    </div>
  </section>

  <section class="section section--paper2" aria-labelledby="t-regions">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="sec-kicker">Three Spheres</p>
        <h2 class="sec-title" id="t-regions">三个文化圈<small>它们各自擅长什么</small></h2>
      </div>
      <div class="regions" id="regions"></div>
    </div>
  </section>

  <section class="section" aria-labelledby="t-cities">
    <div class="wrap">
      <div class="sec-head reveal">
        <p class="sec-kicker">Sixteen Cities</p>
        <h2 class="sec-title" id="t-cities">十六市分布<small>节选项目的数量示意</small></h2>
        <p class="lead">数字为本馆节选条目的数量，用于展示分布密度，不代表官方统计。</p>
      </div>
      <div class="city-grid" id="cities"></div>
    </div>
  </section>
</main>
