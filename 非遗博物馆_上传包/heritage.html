<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>非遗名录 · 安徽数字非遗博物馆</title>
<meta name="description" content="按门类、地区与批次检索安徽非物质文化遗产代表性项目。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23A83A28'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23F7F3EA' font-family='serif'%3E皖%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="heritage">
<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="sec-kicker reveal">The Inventory</p>
      <h1 class="sec-title reveal">非遗名录<small>Catalogue of Representative ICH Projects</small></h1>
      <p class="lead reveal" style="margin-top:20px">
        按十大门类、三大文化区与公布批次检索。当前收录为节选示例，
        完整名录以安徽省文化和旅游厅与中国非物质文化遗产网公布为准。
      </p>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap">
      <div class="toolbar-row">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
          <input id="q" type="search" placeholder="搜索项目、地区或关键词，例如：宣纸 / 傩戏 / 泾县" aria-label="搜索非遗项目">
        </label>
        <span class="select">
          <select id="area" aria-label="按地区筛选">
            <option value="all">全部地区</option>
            <option value="皖南">皖南 · 徽州</option>
            <option value="皖中">皖中 · 江淮</option>
            <option value="皖北">皖北 · 淮河</option>
          </select>
        </span>
        <span class="select">
          <select id="batch" aria-label="按批次筛选"></select>
        </span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <section class="wrap">
    <div class="result-line">
      <span>共 <b id="count">0</b> 个项目</span>
      <span>点击任一项目查看档案</span>
    </div>
    <div class="grid-list" id="list"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
